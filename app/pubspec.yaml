name: chessroad
description: 棋路-中国象棋基于 flutter 的实现。
publish_to: "none"
version: 1.2.9+28

environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  win32: ^4.1.4
  ffi: ^2.0.1
  cupertino_icons: 1.0.4
  provider: 6.0.2
  path_provider: ^2.0.9
  date_format: 2.0.6
  package_info_plus: ^4.2.0
  flutter_linkify: ^6.0.0
  url_launcher: 6.1.7
  flutter_easyloading: 3.0.5
  image_picker: ^0.8.6
  http: ^0.13.5
  path: ^1.8.2
  flutter_overlay_window: ^0.5.0

  pikafish_engine: 1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 2.0.1

flutter:
  uses-material-design: true

  assets:
    - images/logo.png
    - images/mei.png
    - images/zhu.png
    - images/qrcode.png
    - images/bg.jpg
    - images/room.png
    - images/nobody.png

    - assets/audios/bg_music.mp3
    - assets/audios/capture.mp3
    - assets/audios/check.mp3
    - assets/audios/click.mp3
    - assets/audios/regret.mp3
    - assets/audios/draw.mp3
    - assets/audios/tips.mp3
    - assets/audios/invalid.mp3
    - assets/audios/lose.mp3
    - assets/audios/move.mp3
    - assets/audios/win.mp3

    - assets/pikafish.nnue

  fonts:
    - family: ZhongSan
      fonts:
        - asset: fonts/sunzhongsan.ttf

    - family: QiTi
      fonts:
        - asset: fonts/qiti.ttf

    - family: XiaoLi
      fonts:
        - asset: fonts/hanyixiaoli.ttf
