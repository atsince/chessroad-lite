android {
    compileSdkVersion 34
    namespace "cn.mdevs.apps.chessroad"

    defaultConfig {

        applicationId "cn.mdevs.apps.chessroad"

        minSdkVersion 23
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        addManifestPlaceholders([
            TENCENT_APP_ID: "1111227497"
        ])
        externalNativeBuild {
            cmake {
                cppFlags ""
                abiFilters = ["armeabi-v7a","arm64-v8a"]
            }
        }
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
        multiDexEnabled true
    }


    signingConfigs {
        release {
            keyAlias 'stargames'
            keyPassword '9cb56461a3e2c6ccbb5ed76828b10487'
            storeFile file('stargames.keystore')
            storePassword 'eeabc36f227c5e3c0885b54a2dcdcbad'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            // 关闭混淆
            minifyEnabled false
            shrinkResources false
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            shrinkResources false
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.release
        }
    }
